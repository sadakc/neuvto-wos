name: CI

# Build step 0. Every push and every pull request runs the same four checks the
# release-gate agent runs locally, so a regression cannot reach the app unnoticed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  database:
    name: Migrations · Tenant isolation · Data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts the full local Supabase stack. Needed rather than a bare Postgres
      # container because the harness impersonates authenticated roles and relies
      # on the auth schema and pgcrypto.
      - name: Start Supabase
        run: supabase start

      # Applies every migration in order against a clean database. A migration
      # that only works when applied on top of existing data fails here, which is
      # the point.
      - name: Apply migrations from scratch
        run: supabase db reset --no-seed

      - name: Run harness
        run: bash scripts/harness.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Surfaces missing RLS, permissive policies and unindexed foreign keys that
      # the harness would not catch because no test happens to exercise them.
      - name: Supabase advisors
        run: supabase inspect db outliers || true

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  guardrails:
    name: Architecture guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — the migration check diffs against origin/main.
          fetch-depth: 0

      # Cheap greps for the violations that are easy to introduce during a hurried
      # fix and expensive to find later. Each mirrors a rule in
      # docs/standards/NEUVTO_CODING_STANDARDS.md.
      - name: Platform must not import modules
        run: |
          if grep -rEn "from ['\"][^'\"]*modules/" src/platform 2>/dev/null; then
            echo "::error::src/platform imports from src/modules — the platform must not depend on any module."
            exit 1
          fi

      - name: Modules must not import each other
        run: |
          fail=0
          for dir in src/modules/*/; do
            [ -d "$dir" ] || continue
            mod=$(basename "$dir")
            # -P only: the negative lookahead is PCRE, and -E cannot be combined with -P.
            if grep -rPn "from ['\"][^'\"]*modules/(?!${mod}\b)" "$dir" 2>/dev/null; then
              echo "::error::$mod imports another module directly. Cross-module data goes through a published interface."
              fail=1
            fi
          done
          exit $fail

      # The Lovable quarantine is enforced by ESLint (no-restricted-imports) in the
      # `code` job, not here. A grep cannot see an `eslint-disable` exemption, so the
      # two checks disagreed: ESLint allowed the one documented exception in
      # src/routes/auth.tsx and this job failed it. Two enforcement mechanisms that
      # disagree are worse than one that is precise — so this check was removed
      # rather than taught to parse comments.

      # Only the registry may name a module. This is what makes removing one a
      # two-line operation rather than a search across the codebase — and it is
      # the rule that decays first, because importing a module directly always
      # looks like the shorter path in the moment.
      #
      # Comments are stripped before matching. The auth.uid() check was written
      # twice without doing that and flagged its own documentation both times.
      - name: Only the registry may name a module
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          offences = []
          for path in pathlib.Path("src").rglob("*.ts*"):
              rel = str(path)
              if rel.startswith("src/modules/"):
                  continue                      # a module may import itself
              if rel == "src/modules/registry.ts":
                  continue
              src = path.read_text()
              code = re.sub(r"/\*.*?\*/", "", src, flags=re.S)      # block comments
              code = re.sub(r"//[^\n]*", "", code)                   # line comments
              for n, line in enumerate(code.splitlines(), 1):
                  m = re.search(r"""from ['"]@?/?modules/([a-z0-9_]+)""", line)
                  if m and m.group(1) != "registry":
                      offences.append(f"{path}:{n}: {line.strip()}")

          if offences:
              print("\n".join(offences))
              print("::error::Only src/modules/registry.ts may name a module. "
                    "Everything else goes through @/platform/modules.")
              sys.exit(1)
          PY

      # Rule 3 of the coding standards, documented since Phase 0 and until now
      # never enforced: a module is imported by its root or not at all.
      - name: No deep imports into a module
        run: |
          if grep -rEn "from ['\"][^'\"]*modules/[a-z0-9_]+/[a-z]" src --include='*.ts' --include='*.tsx' \
               | grep -v '^src/modules/'; then
            echo "::error::Import a module by its root (@/modules/leave), never a path inside it."
            exit 1
          fi

      # The literal statement of the requirement: changing or removing a module
      # must not require touching anything else. Delete the folder, delete its
      # registry line, and the application must still build.
      #
      # Asserted rather than believed, because "we were careful" is how the
      # coupling comes back.
      # The literal statement of the requirement: changing or removing a module
      # must not require touching anything else. Delete the folder, delete its
      # registry line, and the application must still build.
      #
      # Asserted rather than believed — "we were careful" is how the coupling
      # comes back.
      - name: A module can be removed without touching anything else
        run: |
          bun install --frozen-lockfile
          bash scripts/verify-module-removal.sh

      - name: No raw colour values in product code
        run: |
          if grep -rEn "(#[0-9a-fA-F]{3,8}\b|bg-\[#|text-\[#|border-\[#)" \
               src/modules src/components/shared 2>/dev/null; then
            echo "::error::Raw colour value found. Use semantic tokens — see NEUVTO_DESIGN_SYSTEM.md §1."
            exit 1
          fi

      # Lovable commits .env with the *publishable* Supabase keys, which are designed
      # to ship in the browser and are protected by RLS. That is fine. What must never
      # land there is a real secret, because git history is permanent.
      - name: No real secrets in .env
        run: |
          if [ -f .env ]; then
            if grep -nE '(service_role|SERVICE_ROLE|sk_live|sk_test|re_[A-Za-z0-9]{16,}|SECRET|PRIVATE_KEY|-----BEGIN)' .env; then
              echo "::error file=.env::A real secret appears to be in .env, which is committed. Move it to GitHub Actions secrets, Supabase Edge Function secrets, or Lovable's secret manager. Publishable/anon keys are fine here; service_role keys and API keys are not."
              exit 1
            fi
          fi

      - name: RLS policies must use (select auth.uid())
        run: |
          # Only executable SQL counts. Migrations legitimately discuss
          # auth.uid() in prose — both in `--` comments and inside COMMENT ON
          # string literals — and a plain grep flagged the check against its own
          # documentation twice. Strip comments and single-quoted strings first,
          # preserving line numbers so the report still points somewhere useful.
          python3 - <<'PY'
          import re, sys, pathlib

          def blank_out(pattern, text):
              # Replace each match with the same number of newlines, so line
              # numbers survive.
              return re.sub(pattern, lambda m: "\n" * m.group(0).count("\n"), text, flags=re.S)

          offences = []
          for path in sorted(pathlib.Path("supabase/migrations").glob("*.sql")):
              src = path.read_text()
              code = blank_out(r"--[^\n]*", src)          # line comments
              code = blank_out(r"'(?:[^']|'')*'", code)   # string literals ($$ bodies survive)
              for n, line in enumerate(code.splitlines(), 1):
                  if "auth.uid()" in line and "select auth.uid()" not in line.lower():
                      offences.append(f"{path}:{n}: {src.splitlines()[n-1].strip()}")

          if offences:
              print("\n".join(offences))
              print("::error::Bare auth.uid() in a policy — it is re-evaluated per row. Wrap as (select auth.uid()).")
              sys.exit(1)
          PY

      - name: Every new table enables RLS
        run: |
          fail=0
          for f in $(git diff --name-only origin/main...HEAD -- 'supabase/migrations/*.sql' 2>/dev/null || true); do
            [ -f "$f" ] || continue
            for t in $(grep -oiP 'create table (if not exists )?\K(public\.)?\w+' "$f" | sed 's/public\.//'); do
              if ! grep -qi "alter table.*$t.*enable row level security" "$f"; then
                echo "::error file=$f::Table '$t' is created without RLS enabled in the same migration."
                fail=1
              fi
            done
          done
          exit $fail
