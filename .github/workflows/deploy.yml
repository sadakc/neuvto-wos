# Publish neuvto.com — built here, where we control which database it points at.
#
# WHY THIS EXISTS
#
# Lovable builds the published site and injects its own backend variables, which
# override the repository's. Twice — 3 Aug and 6 Aug 2026 — that put the live
# site on the PRE-PRODUCTION database. The second time, sign-in returned HTTP 200
# and sent no email, because it was authenticating against a project with no SMTP
# configured. Nothing failed loudly. See docs/operations/PRODUCTION_HOSTING.md.
#
# The variables below come from repository secrets, so the build cannot be
# repointed by anything outside this file.
#
# THE ORDER OF THE LAST THREE STEPS IS THE WHOLE DESIGN
#
#   build → verify the ARTEFACT → publish → verify the LIVE SITE
#
# Verifying only after publishing means discovering the mistake once the world
# can already see it. The artefact check is what makes a wrong build unpublishable
# rather than merely regrettable.

# A DEPLOY USED TO COST MONEY, AND THE GUARD STAYS ANYWAY
#
# Hosting moved to Cloudflare Workers on 18 Aug 2026 (D61), where deploys are
# metered at no tier — so the arithmetic below no longer bites. It is kept
# because the reasoning outlived the bill: a commit that cannot change the site
# should not appear in the deploy history claiming it did.
#
# The original constraint, for the record:
#
# Netlify's free plan is 300 credits a month and charges 15 per production
# deploy. Twenty deploys, total. On this workflow's first day — 7 Aug 2026 — it
# published eight times and FOUR of those shipped a byte-identical site: two
# documentation pull requests, one change to verify-deploy.sh, and one manual
# re-run of the same commit. Sixty credits, a fifth of the month, for nothing.
#
# `paths-ignore` skips a push only when EVERY changed file matches, so a pull
# request touching both src/ and docs/ still deploys — which is right, and is
# why #63 through #66 would all still have published. It is the docs-only
# commit, and only that, which now goes quiet.
#
# supabase/ is on the list because migrations are applied by hand and never
# reach the bundle; scripts/ is on it because changing the verifier does not
# change what it verifies. Either can still be exercised deliberately through
# workflow_dispatch, which is why that trigger stays.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "supabase/**"
      - "neuvto-harness/**"
      - "scripts/**"
      - ".github/**"
      - ".claude/**"
  workflow_dispatch:

# A second push while the first is deploying would race to publish. Newest wins;
# cancelling mid-deploy is safe because Cloudflare promotes atomically too — a
# new Worker version serves traffic only once it is fully uploaded, so a killed
# run leaves the previous version live rather than a half-published one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # main is protected and every PR runs these, but a deploy workflow that
      # trusts that is one force-push away from publishing a broken build.
      - name: Lint, types, tests
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Build
        env:
          # Baked into the bundle at build time. Public by design — they are
          # readable in the shipped JavaScript by anyone who looks.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # The server half reads these unprefixed names. Deliberately NOT
          # VITE_-prefixed: anything so named is copied into the browser bundle.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # No NITRO_PRESET: Cloudflare is Nitro's default target here, so the
          # plain build emits a Worker. Netlify was the override, not the norm.
          #
          # PINNED, and not decorative. Nitro defaults the Worker's compatibility
          # date to "today" from the BUILD MACHINE'S LOCAL CLOCK; Cloudflare
          # validates it against UTC and rejects anything ahead of it. India is
          # UTC+5:30, so a build between 00:00 and 05:30 IST is refused with
          # "Can't set compatibility date in the future". It failed exactly that
          # way at 01:31 IST on 18 Aug 2026. Runners are UTC and would never
          # reproduce it. Pinning also stops the runtime's behaviour changing
          # between two builds of identical source.
          NITRO_COMPATIBILITY_DATE: "2026-08-17"
        run: bun run build

      # ─────────────────────────────────────────────── the gate
      #
      # Fails the job before anything is published if the artefact names any
      # project other than production — or if it names none at all, which means
      # the check could not find what it was looking for and has verified
      # nothing. Proven by building against pre-prod on purpose and watching
      # this step fail.
      - name: Verify the build before publishing it
        run: bash scripts/verify-deploy.sh --dir .output

      # Which hostnames this Worker answers on, and a refusal if the generated
      # config is unusable. Runs BEFORE publish for the same reason the artefact
      # check does: a bad config should stop the job, not the deploy.
      - name: Set the Worker's custom domains
        run: bun scripts/cloudflare-worker-config.mjs

      - name: Publish to Cloudflare Workers
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Prebuilt, for the same reason Netlify was: Cloudflare publishes what
          # we built here and never builds it itself. A build environment we do
          # not own is the problem this workflow exists to remove.
          #
          # Cloudflare meters no deploys at any tier, so unlike Netlify's 15
          # credits a publish, a redundant run here costs nothing. `paths-ignore`
          # above stays anyway: a deploy that cannot change the site is still
          # noise in the deploy history.
          bunx wrangler@4 deploy --config .output/server/wrangler.json

      # The artefact check above proves what we built. This proves what is being
      # SERVED, which is a different claim: a stale cache, a half-finished
      # rollout, or a deploy to the wrong site all pass the first check and fail
      # this one.
      - name: Verify the live site
        run: |
          echo "Waiting for the rollout to settle before checking."
          sleep 30
          bash scripts/verify-deploy.sh --url "${DEPLOY_URL:-https://neuvto.com}"
        env:
          # Checks neuvto.com, which this job now publishes. The DEPLOY_URL
          # repository variable was deleted at the cutover on 18 Aug 2026 and
          # should stay deleted; the fallback above is the real target.
          #
          # It existed because before the cutover neuvto.com was served by
          # NETLIFY while this workflow published the Worker to wos.neuvto.com.
          # Checking neuvto.com then would have passed against a site this job
          # did not deploy — a green tick for a claim nobody made. Set it again
          # only if the two ever diverge again, and delete it when they converge.
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
