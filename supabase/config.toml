# Names the LOCAL Docker containers and nothing else — it targets no remote
# project. It used to read `vkyvzhgigncranprhidn`, the Lovable Cloud project,
# which made this the single most misleading line in the repo: it read like a
# deployment target, and Sada reasonably concluded that work was being pushed
# into a database he does not own.
#
# What actually decides a remote target:
#   supabase/.temp/project-ref   `--linked` obeys this — gitignored, per-machine
#   --project-ref <ref>          an explicit flag, which beats everything
#   .env                         which database the APP talks to
#
# A neutral name here can never be mistaken for any of them.
project_id = "neuvto-wos"

# Local-development configuration. `supabase start` reads this; it is not pushed
# to the hosted project, so anything here must also be configured there before
# it ships. See the note on templates below.

# Mailpit, the local mail catcher.
#
# It publishes its web UI by default but NOT its SMTP port, so nothing on this
# machine can post a message into it. Supabase Auth doesn't care — it talks to
# Mailpit inside the Docker network — but that left product email with nowhere
# local to go, and looking for an invitation in the one inbox on the machine
# turned up only sign-in codes.
#
# Publishing the SMTP port lets the Resend stub relay product mail into the same
# inbox, so there is ONE place to check rather than two delivery paths and one
# visible outcome. Requires a `supabase stop && supabase start` to take effect.
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]

# Session timeouts are NOT set here.
#
# `session_idle_minutes` and `session_absolute_hours` live on
# `organization_settings` and are read by the browser through `session_policy()`
# — per organisation and per role, which no static config file could express.
#
# `jwt_expiry` is deliberately absent too. It belongs on the hosted project, set
# through the dashboard, for the reason spelled out below: pushing this file
# sends the WHOLE [auth] block, including the localhost site_url. Adding a value
# here creates a reason to push a file that must not be pushed.

[auth.email]
enable_signup = true
# D8 — no passwords anywhere. Nothing to phish, forget, reuse, or leak.
enable_confirmations = false
secure_password_change = false
max_frequency = "10s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Neuvto sign-in code"
content_path = "./supabase/templates/magic_link.html"

# ── IMPORTANT, before this reaches customers ────────────────────────────────
# Supabase's DEFAULT email template contains only a magic link — no code. A UI
# that asks for a 6-digit code therefore cannot be completed, because the code
# is never sent. The template above fixes that locally.
#
# It does NOT reach the hosted project, and the reason is not the one this
# comment used to give. `supabase config push` exists and would carry this
# file's [auth] block to the linked project — but the push is refused:
#
#     Email template modification is not available for free tier projects
#     using the default email provider.
#
# So this is not a dashboard setting somebody forgot to change. It is locked
# until custom SMTP is configured on Resend, which is free and also stops the
# sign-in email arriving from another company's domain. See
# docs/operations/EMAIL_AND_DOMAINS.md, "Where this stands".
#
# ── AND DO NOT PUSH THIS FILE AS IT STANDS ──────────────────────────────────
# `supabase config push` sends the WHOLE [auth] block, including the two values
# below, which are local-only:
#
#     site_url                 = http://localhost:8080
#     additional_redirect_urls = [http://localhost:8080]
#
# Pushing them would point the hosted project's magic links at a developer's
# laptop. The hosted values are set directly and recorded in EMAIL_AND_DOMAINS
# .md; make this file environment-aware before anyone runs that command.
#
# Tracked as a launch blocker in NEUVTO_MVP_BUILD_SPEC.md.

# ── Edge functions ──────────────────────────────────────────────────────────
#
# Read by `supabase functions deploy`, NOT by `supabase config push`. Adding
# this section does not make the file above any safer to push — the [auth]
# warning stands, unchanged.

[functions.notification-dispatch]
# Invoked by pg_cron with the service key. The default (verify_jwt = true) is
# correct and is stated rather than left implicit, so that the contrast with
# the entry below is deliberate rather than something somebody has to notice.
verify_jwt = true

[functions.client-error]
# PUBLIC ON PURPOSE. This is the one endpoint in the system that accepts an
# unauthenticated request, and the whole point of it is callers who have no
# session: a crash on the landing page, on /auth, or midway through accepting
# an invitation.
#
# Leaving this true would make the function deploy cleanly, return 401 to every
# real caller, and record nothing — which is indistinguishable from the blind
# spot it was built to close, and is how this would silently not work.
#
# It does NOT weaken `anon executes nothing` (20260808100000). The function
# holds the service key and calls record_public_client_error, which is granted
# to service_role alone. `anon` still cannot execute one database function.
#
# Read the header of supabase/functions/client-error/index.ts before changing
# this — the bounds that make a public endpoint acceptable are described there,
# and the one that matters is a separate 100-per-day ceiling in Postgres.
verify_jwt = false
